# Local Graftcode smoke: Postgres + villains-gg (see Dockerfile in this folder).
services:
  villains-db:
    image: postgres:18
    container_name: villains-db-graft-smoke
    environment:
      POSTGRES_USER: superbad
      POSTGRES_PASSWORD: superbad
      POSTGRES_DB: villains_database
    volumes:
      - ../db-init/initialize-tables.sql:/docker-entrypoint-initdb.d/1-init-tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superbad -d villains_database"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - graft-smoke

  villains-gg:
    build:
      context: ../..
      dockerfile: deploy/graft-smoke/Dockerfile
    container_name: villains-gg
    depends_on:
      villains-db:
        condition: service_healthy
    ports:
      - "8091:80"
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://villains-db:5432/villains_database
      QUARKUS_DATASOURCE_USERNAME: superbad
      QUARKUS_DATASOURCE_PASSWORD: superbad
      GG_ENDPOINT: https://d.grft.dev
    networks:
      - graft-smoke

networks:
  graft-smoke:
    name: villains-graft-smoke
