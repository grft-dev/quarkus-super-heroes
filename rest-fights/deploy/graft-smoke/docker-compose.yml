# Local Graftcode smoke: MongoDB, Kafka, Apicurio + fights-gg (see Dockerfile in this folder).
services:
  fights-db:
    image: mongo:8
    container_name: fights-db-graft-smoke
    environment:
      MONGO_INITDB_DATABASE: fights
      MONGO_INITDB_ROOT_USERNAME: super
      MONGO_INITDB_ROOT_PASSWORD: super
    volumes:
      - ../db-init/initialize-database.js:/docker-entrypoint-initdb.d/1-init-db.js
    networks:
      - graft-smoke

  apicurio:
    image: quay.io/apicurio/apicurio-registry:3.1.7
    container_name: apicurio-graft-smoke
    environment:
      REGISTRY_AUTH_ANONYMOUS_READ_ACCESS_ENABLED: "true"
      QUARKUS_HTTP_PORT: 8086
    networks:
      - graft-smoke

  fights-kafka:
    image: apache/kafka-native:4.2.0
    container_name: fights-kafka-graft-smoke
    depends_on:
      - apicurio
    environment:
      LOG_DIR: /tmp/logs
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://fights-kafka:9092
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    networks:
      - graft-smoke

  fights-gg:
    build:
      context: ../..
      dockerfile: deploy/graft-smoke/Dockerfile
    container_name: fights-gg
    depends_on:
      - fights-db
      - apicurio
      - fights-kafka
    ports:
      - "8092:80"
      - "8093:81"
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_MONGODB_HOSTS: fights-db:27017
      QUARKUS_MONGODB_CREDENTIALS_USERNAME: superfight
      QUARKUS_MONGODB_CREDENTIALS_PASSWORD: superfight
      KAFKA_BOOTSTRAP_SERVERS: PLAINTEXT://fights-kafka:9092
      MP_MESSAGING_CONNECTOR_SMALLRYE_KAFKA_APICURIO_REGISTRY_URL: http://apicurio:8086/apis/registry/v2
      QUARKUS_LIQUIBASE_MONGODB_MIGRATE_AT_START: "false"
      QUARKUS_OTEL_SDK_DISABLED: "true"
      GG_ENDPOINT: https://d.grft.dev
    networks:
      - graft-smoke

networks:
  graft-smoke:
    name: fights-graft-smoke
